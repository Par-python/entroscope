[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "entroscope"
version = "0.3.1"
description = "The definitive entropy toolkit for time series data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "entroscope contributors" }]
keywords = ["entropy", "time-series", "shannon", "permutation", "spectral"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[project.optional-dependencies]
sklearn = ["scikit-learn"]
polars = ["polars"]
# Independent implementations used by tests/test_reference.py to cross-check results.
reference = ["antropy", "EntropyHub"]
docs = ["mkdocs-material", "mkdocs<2"]
dev = ["pytest", "pytest-cov", "ruff==0.16.7", "scikit-learn", "polars"]

[project.urls]
Homepage = "https://github.com/Par-python/entroscope"

[tool.setuptools.packages.find]
include = ["entroscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import some helpers next to the tests that use them.
"tests/*" = ["E402"]
