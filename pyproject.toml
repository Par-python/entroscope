[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "entropix"
version = "0.1.0"
description = "The definitive entropy toolkit for time series data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "entropix contributors" }]
keywords = ["entropy", "time-series", "shannon", "permutation", "spectral"]
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/entropix/entropix"

[tool.setuptools.packages.find]
include = ["entropix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
